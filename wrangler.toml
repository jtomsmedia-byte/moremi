name = "moremi"
main = ".open-next/worker.js"
compatibility_date = "2024-03-20"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "moremi-db"
database_id = "YOUR_DATABASE_ID_HERE"

[[r2_buckets]]
binding = "R2"
bucket_name = "moremi-files"